<!DOCTYPE html>
<html lang="en" data-skin="atlas" data-pal="delft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classy European Vacation</title>
<meta name="theme-color" content="#1B2F6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Classy European Vacation">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#EEF1F2; --card:#FFFFFF; --ink:#16222C; --muted:#5A6873; --line:#D8DEE2;
  --prague:#A8362A; --ams:#1E6A8C; --bruges:#A87612; --mark:#FFE57A; --markink:#3d3000;
  --accent:var(--prague);
  --head:"IM Fell English",Georgia,serif;
  --fell:"IM Fell English",Georgia,"Times New Roman",serif;
  --body:"EB Garamond",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101A21; --card:#192630; --ink:#E9EEF1; --muted:#9AA9B4; --line:#2A3A46;
    --prague:#E2705F; --ams:#5BB1D4; --bruges:#E0AE4A; --mark:#6b5a10; --markink:#FFF1B3;
  }
}
:root[data-theme="dark"]{
  --bg:#101A21; --card:#192630; --ink:#E9EEF1; --muted:#9AA9B4; --line:#2A3A46;
  --prague:#E2705F; --ams:#5BB1D4; --bruges:#E0AE4A; --mark:#6b5a10; --markink:#FFF1B3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body[data-city="prague"]{--accent:var(--prague)}
body[data-city="amsterdam"]{--accent:var(--ams)}
body[data-city="bruges"]{--accent:var(--bruges)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{padding:18px 0 10px}
header.top h1{font-size:26px;font-weight:700}
header.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.hero{background:var(--accent);color:#fff;border-radius:18px;padding:18px 18px 16px;margin:6px 0 14px}
.hero h2{font-size:24px;font-weight:700}
.hero p{margin:6px 0 0;opacity:.92;font-size:15.5px}
.hero .big{font-family:var(--head);font-size:34px;font-weight:700;line-height:1}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:15px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daychip{flex:0 0 auto;min-width:58px;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 8px;line-height:1.15}
.daychip b{display:block;font-family:var(--head);font-size:19px}
.daychip small{font-size:12px;color:var(--muted)}
.daychip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.daychip[aria-pressed="true"] small{color:#fff;opacity:.85}
.daychip.today{outline:2px solid var(--ink);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.item{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.time{font-family:var(--head);font-weight:700;font-size:16px;color:var(--accent);padding-top:1px}
.time.none{color:var(--muted);font-weight:500;font-size:14px}
.ttl{font-weight:600;font-size:17.5px}
.ttl .hl{background:linear-gradient(transparent 38%,var(--mark) 38%,var(--mark) 92%,transparent 92%);color:var(--markink);padding:0 3px;border-radius:2px;color:var(--ink)}
.note{color:var(--muted);font-size:15px;margin-top:2px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.tag.book{background:var(--mark);color:var(--markink)}
.tag.opt{border:1px solid var(--line);color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 11px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.sect{font-size:13.5px;font-weight:600;color:var(--muted);margin:16px 2px 8px}
.alert{border-left:5px solid var(--mark);background:var(--card);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:15.5px}
.alert b{display:block}
details.card summary{font-family:var(--head);font-weight:700;font-size:18px;cursor:pointer}
details.card[open] summary{margin-bottom:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;padding:6px 2px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.mapbox{background:#EFE2C2;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 10px rgba(60,40,20,.18)}
.mapbox svg{display:block;width:100%;height:auto}
.sea{fill:#DCE9EF}.land{fill:#E9E4D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sea{fill:#142733}:root:not([data-theme="light"]) .land{fill:#1F2D35}}
:root[data-theme="dark"] .sea{fill:#142733}:root[data-theme="dark"] .land{fill:#1F2D35}
.pin{cursor:pointer}
.eu-c{font-family:var(--fell);font-size:10.5px;letter-spacing:3px;fill:#6B5640}
.eu-sea{font-family:var(--fell);font-style:italic;font-size:13px;letter-spacing:2px;fill:#3F6670}
.eu-o{font-family:var(--fell);font-style:italic;font-size:8.5px;fill:#5A4630}
.eu-g{font-family:var(--fell);font-size:6.5px;fill:#5A4630;opacity:.75}
.eu-r{font-family:var(--fell);font-style:italic;font-size:9.5px;fill:#3A2A1C;paint-order:stroke;stroke:#EFE2C2;stroke-width:3px}
.eu-city{font-family:var(--fell);font-size:15px;fill:#2B2118;paint-order:stroke;stroke:#F3E8CC;stroke-width:3.5px}
.eu-t{font-family:var(--fell);font-size:13px;fill:#2B2118;letter-spacing:1px}
.eu-ts{font-family:var(--fell);font-style:italic;font-size:8.5px;fill:#5A4630}
.eu-n{font-family:var(--fell);font-size:9px;fill:#3A2A1C}
.place{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.place:first-child{border-top:0}
.place .n{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.fact{padding:12px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact button.q{width:100%;text-align:left;background:none;border:0;padding:0;font-weight:600;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.fact p{margin:8px 0 0;color:var(--ink)}
.fact .cat{font-size:12.5px;color:var(--muted);font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.muted{color:var(--muted)}
.small{font-size:14px}

.citywrap{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);margin-bottom:10px}
#citymap{display:block;width:100%;aspect-ratio:4/5;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.m-land{fill:none}
.m-park{fill:#CBD3A3;stroke:#8C8F5C;stroke-width:.8}
.m-block{fill:#DCC9A0;stroke:#8B6B3E;stroke-width:.8}
.m-plaza{fill:#F6EBCB;stroke:#8B6B3E;stroke-width:.8}
.m-ij{fill:#BCCFC5;stroke:#6F8F94;stroke-width:1.2}
.m-wedge{fill:none;stroke:#6F8F94;stroke-linecap:round;stroke-linejoin:round}
.m-water{fill:none;stroke:#BCCFC5;stroke-linecap:round;stroke-linejoin:round}
.m-case{fill:none;stroke:#8B6B3E;stroke-linecap:round;stroke-linejoin:round}
.m-st{fill:none;stroke:#F1E4BF;stroke-linecap:round;stroke-linejoin:round}
.m-lbl{font-family:var(--fell);font-size:11.5px;fill:#4A3520;font-style:italic;letter-spacing:.3px}
.m-wlbl{font-family:var(--fell);font-size:11.5px;fill:#2F5560;font-style:italic;letter-spacing:.5px}
.m-hood{font-family:var(--fell);font-size:15px;fill:#8A7350;letter-spacing:3px}
.m-dl{font-family:var(--fell);font-size:15.5px;font-weight:400;fill:#2A1D10;paint-order:stroke;stroke:#EBDCB2;stroke-width:4.5px;stroke-linejoin:round}
.paper{background:
  radial-gradient(ellipse at 15% 25%,rgba(170,120,55,.20),transparent 45%),
  radial-gradient(ellipse at 85% 80%,rgba(140,95,40,.24),transparent 50%),
  radial-gradient(ellipse at 70% 15%,rgba(190,150,80,.14),transparent 40%),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .14 0 0 0 .26 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
  #E9D8AC !important;border-color:#7A5C34 !important}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 70px 14px rgba(110,70,25,.38)}
.paper::after{content:"";position:absolute;inset:7px;pointer-events:none;z-index:2;border:1.5px solid #6B4F2C;border-radius:8px;outline:1px solid #6B4F2C;outline-offset:3px}
.compass{position:absolute;left:14px;top:14px;width:62px;height:62px;z-index:3;pointer-events:none}
.mtitle{position:absolute;left:80px;top:16px;z-index:3;pointer-events:none;font-family:var(--fell);color:#3A2814;line-height:1.05;text-shadow:0 0 6px #E9D8AC,0 0 6px #E9D8AC}
.mtitle b{display:block;font-size:24px;font-weight:400;letter-spacing:3px;font-family:var(--fell)}
.mtitle i{font-size:13.5px;letter-spacing:1px}
.zoomctl{z-index:4}
.zoomctl button{background:#F3E7C6 !important;color:#2A1D10 !important;border-color:#7A5C34 !important}
.sheet{z-index:4;background:#F5EBCD !important;color:#2A1D10;border:1.5px solid #6B4F2C !important}
.sheet b{font-family:var(--fell);font-weight:400;font-size:21px}
.sheet .note{color:#5C4A33}
.sheet .x{color:#5C4A33}
.sheet .btn{color:#2A1D10;border-color:#7A5C34;font-size:13.5px;padding:6px 9px}
.sheet .acts{flex-wrap:nowrap;gap:6px}
.sheet{padding:10px 12px !important}
.sheet .btn.primary{color:#fff;border-color:#2A1D10;background:#2A1D10}
.mdot{cursor:pointer}
.zoomctl{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:700;line-height:1}
.sheet{position:absolute;left:16px;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sheet .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:24px;color:var(--muted);width:36px;height:36px}
.sheet b{font-family:var(--head);font-size:18px;display:block;padding-right:30px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin:0 2px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:15px;z-index:9}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* sketch as a 'where are we' icon */
.hero.withsk{position:relative;padding-right:132px;min-height:132px}
.skicon{position:absolute;right:12px;top:12px;width:112px;height:90px;background:#F6F1E4;border-radius:12px;padding:4px;--skw:#CFE0E3;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.skicon .sketch,.tripsk .sketch{width:100%;height:100%}
.hero .where{font-size:15px;margin-top:8px;opacity:1}
.tripcard{position:relative;padding-right:92px}
.tripsk{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:72px;height:58px;background:#F6F1E4;border-radius:8px;padding:2px;--skw:#CFE0E3}
@media (max-width:360px){.hero.withsk{padding-right:110px}.skicon{width:92px;height:74px}}
/* neighborhood sketch */
.skcard{padding:12px}
.skbox{border-radius:10px;overflow:hidden;background:#F6F1E4;--skw:#CFE0E3;
  background-image:repeating-linear-gradient(transparent 0 25px,rgba(70,130,170,.22) 25px 26px)}
.sketch{display:block;width:100%;height:auto}
.sk-area{cursor:pointer}
.sk-area:focus-visible polygon{stroke:var(--ams);stroke-width:4}
.sk-l{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15.5px;fill:#1E2A35;pointer-events:none;letter-spacing:.5px}
.sk-d{font-family:var(--head);font-size:12.5px;font-weight:700;fill:#fff;pointer-events:none}
.sk-w{font-family:"Architects Daughter",cursive;font-size:13px;fill:#2F5560;font-style:italic;pointer-events:none}
.sk-s{font-family:"Architects Daughter",cursive;font-size:12px;fill:#1E2A35}
.areacard{position:relative;margin-top:10px;padding-top:2px}
.areacard .x{position:absolute;top:-6px;right:-6px;border:0;background:none;font-size:26px;color:var(--muted);width:40px;height:40px}
.seelist{display:flex;flex-wrap:wrap;gap:6px}
.seelist span{background:var(--bg);border-radius:8px;padding:3px 9px;font-size:14.5px}
/* days that have passed */
.daychip.past:not([aria-pressed="true"]){opacity:.45;filter:grayscale(.85)}
.chip.past:not([aria-pressed="true"]){opacity:.5;filter:grayscale(.85);text-decoration:line-through}
.tripcard.past{opacity:.55;filter:grayscale(.8)}
.tag.done{background:var(--muted);color:var(--card);margin-left:4px}
.pastnote{font-size:15px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:0 0 10px}
.pastwrap{opacity:.6;filter:grayscale(.75)}
/* past items on maps */
.place.past{opacity:.5;filter:grayscale(.85)}
.m-dl.gone{fill:#7d776f}
/* install card */
.alert.nudge{position:relative;padding-right:40px}
.alert.nudge .x{position:absolute;top:2px;right:4px;border:0;background:none;font-size:24px;color:var(--muted);width:36px;height:36px}
details.install summary{display:flex;align-items:center;gap:10px}
details.install summary img{border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.steps{margin:6px 0 10px;padding-left:22px}
.steps li{margin:3px 0}
/* plans */
.tag.top{background:var(--ink);color:var(--bg)}
.tag.nb{border:1px solid var(--ams);color:var(--ams);margin-left:4px}
.warn{display:inline-block;font-size:13.5px;font-weight:600;color:var(--markink);background:var(--mark);border-radius:6px;padding:1px 8px;margin-top:5px}
.mlink{font-weight:600;font-size:14px;white-space:nowrap}
.num{background:var(--ams);display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;color:#fff;font-family:var(--head);font-size:13px;font-weight:700;margin-right:7px;vertical-align:1px;padding:0 4px}
.pickrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.plancard{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 8px;text-align:left;line-height:1.2;min-height:72px}
.plancard small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-bottom:3px}
.plancard b{font-family:var(--head);font-size:15.5px;font-weight:700}
.plancard[aria-pressed="true"]{border-color:var(--pc);background:var(--pc);color:#fff}
.plancard[aria-pressed="true"] small{color:#fff;opacity:.85}
.glance{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr));gap:5px}
.glance .gh{border:0;border-radius:8px;background:transparent;color:var(--pc);font-family:var(--head);font-weight:700;font-size:16px;padding:2px 0}
.glance .gh.on{background:var(--pc);color:#fff}
.glance .gd{display:flex;flex-direction:column;justify-content:center;line-height:1.05}
.glance .gd b{font-family:var(--head);font-size:17px}
.glance .gd small{font-size:11.5px;color:var(--muted)}
.glance .gc{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 5px;font-size:13px;font-weight:600;line-height:1.2;text-align:left;min-height:44px;overflow-wrap:anywhere}
.glance .gc.on{border-color:var(--pc);box-shadow:inset 4px 0 0 var(--pc)}
.glance .gc.sh{color:var(--muted);font-weight:500}
details.pday summary{list-style:none;line-height:1.2}
details.pday summary::-webkit-details-marker{display:none}
details.pday summary::after{content:"+";float:right;font-size:22px;color:var(--muted);margin-top:-30px}
details.pday[open] summary::after{content:"−"}
details.pday .sub{display:block;font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted);margin-top:2px}
.why{font-size:15.5px;margin:0 0 10px;padding:8px 10px;background:var(--bg);border-radius:8px}
@media (prefers-reduced-motion:no-preference){.hero{transition:background .25s}}

/* ---------- OLD ATLAS LOOK ---------- */
:root[data-skin]{--paperimg:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .33 0 0 0 0 .16 0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
:root[data-skin] body{background-image:var(--paperimg);font-size:var(--fs,17px)}
:root[data-skin] .card,:root[data-skin] nav.tabs,:root[data-skin] .chip,:root[data-skin] .daychip,:root[data-skin] .opt{background-image:var(--paperimg)}
:root[data-skin] .card{border-radius:var(--rad,6px);box-shadow:0 1px 0 var(--line),0 2px 8px rgba(70,45,20,.08)}
:root[data-skin] .sect{font-variant:small-caps;letter-spacing:1.5px;font-size:15px}
:root[data-skin] .time{font-family:var(--timef,var(--head))}
:root[data-skin] header.top h1{letter-spacing:var(--hls,0)}
:root[data-skin] .hero{border-radius:var(--rad,6px);background-image:var(--paperimg);box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px rgba(255,240,210,.55)}

/* Old Atlas: parchment, oxblood and sea-green, IM Fell headings with Garamond text */

  get(k,d){try{const v=localStorage.getItem("trip:"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("trip:"+k,JSON.stringify(v))}catch(e){}}
};
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const parse = iso => {const [y,m,d]=iso.split("-").map(Number);return {y,m,d,dt:new Date(y,m-1,d)}};
const fmtDate = iso => {const p=parse(iso);return `${WD[p.dt.getDay()]}, ${MO[p.m-1]} ${p.d}`};
/* "Today" is always Prague/Amsterdam/Bruges local time, whatever time zone the phone is set to */
const todayIso = () => {try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Prague",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`}};
const mapsUrl = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const startUtc = (iso,t) => {const p=parse(iso);const [h,mi]=t.split(":").map(Number);return Date.UTC(p.y,p.m-1,p.d,h-2,mi)}; /* CEST = UTC+2 */
const z = ms => new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
function gcal(day,it){
  const s=startUtc(day.date,it.t), e=s+(it.dur||60)*60000;
  const det = (it.note||"")+"\nBooked reservation. Trip guide.";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(it.title)+"&dates="+z(s)+"/"+z(e)+"&details="+encodeURIComponent(det)+(it.q?"&location="+encodeURIComponent(it.q):"");
}
function gcalCancel(){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Last day to cancel Prague reservations")+"&dates=20261009/20261010&details="+encodeURIComponent("Prague bookings can be cancelled until today.");
}

function itemHtml(day,it){
  const time = it.t ? `<div class="time">${it.t}</div>` : `<div class="time none">Anytime</div>`;
  const num = it.num ? `<span class="num">${it.num}</span>` : "";
  const title = it.b ? `${num}<span class="hl">${it.title}</span><span class="tag book">Booked</span>` : `${num}${it.title}${it.top?'<span class="tag top">Don\'t miss</span>':""}${it.o?'<span class="tag opt">Idea</span>':''}`;
  let acts="";
  if(it.q||it.b){
    acts = `<div class="acts">${it.q?`<a class="btn" target="_blank" rel="noopener" href="${mapsUrl(it.q)}">Open in Maps</a>`:""}${it.b&&it.t&&day.date>=T?`<a class="btn primary" target="_blank" rel="noopener" href="${gcal(day,it)}">Add to calendar</a>`:""}</div>`;
  }
  return `<div class="item">${time}<div><div class="ttl">${title}</div>${it.note?`<div class="note">${it.note}</div>`:""}${it.w?`<div class="warn">${it.w}</div>`:""}${acts}</div></div>`;
}

function nextBooking(){
  const now=Date.now(); let best=null;
  DAYS.forEach(d=>d.items.forEach(it=>{ if(it.b&&it.t){const s=startUtc(d.date,it.t); if(s>now&&(!best||s<best.s)) best={s,it,d}} }));
  return best;
}

  const m=Math.max(0,Math.floor(ms/60000)), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mi=m%60;
  return d>0?`${d}d ${h}h`:h>0?`${h}h ${mi}m`:`${mi}m`;
}

function voteHtml(id){
  const v=VOTES[id], mine=store.get("votes",{})[id];
  return `<div class="muted small">${v.label}. Tap your pick.</div><div class="opts">${v.opts.map(o=>`<button class="opt" aria-pressed="${mine===o}" data-vote="${id}" data-val="${o}">${o}</button>`).join("")}</div>`;
}

function viewFun(){
  const done=store.get("checks",{});
  const cc=c=>(Object.values(CITY).find(x=>x.name===c)||{}).color||"var(--accent)";
  const lists=CHECK.map(([c,items])=>`<div class="sect" style="color:${cc(c)}">${c}</div><div class="card" style="border-top-color:${cc(c)}">${items.map(it=>{const k=c+"|"+it;return `<label class="check${done[k]?" done":""}"><input type="checkbox" data-check="${k}" ${done[k]?"checked":""}><span>${it}</span></label>`}).join("")}</div>`).join("");
  const votes=`<div class="sect">Open days: your picks</div>`+Object.keys(VOTES).map(id=>`<div class="card">${voteHtml(id)}</div>`).join("")+`<div class="acts" style="margin:0 0 12px"><button class="btn primary" id="copyVotes">Copy my picks to text</button></div><div class="note small">Picks are saved on this phone only. Copy and send them to the group chat.</div>`;
  return `<h2 style="font-size:22px;margin:4px 0 0">Trip checklist</h2>`+lists+votes;
}

function render(){
  renderTabs();
  const v={today:viewToday,trip:viewTrip,map:viewMap,learn:viewLearn,fun:viewFun}[state.tab]();
  $("#app").innerHTML=v;
  if(state.tab==="trip"||state.tab==="fun") document.body.dataset.city=DAYS[state.dayIdx].city;
}

function smooth(pts){
  const f=n=>n.toFixed(1);
  let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d;
}

const dPast=n=>("2026-10-"+String(n).padStart(2,"0"))<T;

const _lay={};
function cityLayout(){
  const k=state.city; if(_lay[k]) return _lay[k];

  let o=`<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><line x1="0" y1="0" x2="0" y2="7" stroke="#6F8F94" stroke-width=".9" opacity=".55"/></pattern></defs>`;
  (m.parks||[]).forEach(a=>o+=`<polygon class="m-park" points="${poly(a)}"/>`);
  (m.blocks||[]).forEach(a=>o+=`<polygon class="m-block" points="${poly(a)}"/>`);
  if(m.big){const ij=LL(m.big.pts);const d=`${smooth(ij)} L${ij[ij.length-1][0]} -900 L${ij[0][0]} -900 Z`;o+=`<path class="m-ij" d="${d}"/><path d="${d}" fill="url(#hatch)"/>`}
  (m.lakes||[]).forEach(a=>o+=`<polygon class="m-ij" points="${poly(a)}"/><polygon points="${poly(a)}" fill="url(#hatch)"/>`);
  (m.streets||[]).forEach(([id,w,a])=>o+=`<path class="m-case" id="s-${id}" d="${smooth(LL(a))}" stroke-width="${w+1.8}"/>`);
  (m.streets||[]).forEach(([id,w,a])=>o+=`<path class="m-st" d="${smooth(LL(a))}" stroke-width="${w}"/>`);
  (m.plazas||[]).forEach(a=>o+=`<polygon class="m-plaza" points="${poly(a)}"/>`);
  (m.water||[]).forEach(([id,w,a])=>o+=`<path class="m-wedge" d="${smooth(LL(a))}" stroke-width="${w+2}"/>`);
  (m.water||[]).forEach(([id,w,a])=>o+=`<path class="m-water" d="${smooth(LL(a))}" stroke-width="${w}"/>`);
  (m.bridges||[]).forEach(([id,w,a])=>o+=`<path class="m-case" d="${smooth(LL(a))}" stroke-width="${w+2.2}" stroke-linecap="butt"/>`);
  (m.bridges||[]).forEach(([id,w,a])=>o+=`<path class="m-st" d="${smooth(LL(a))}" stroke-width="${w}" stroke-linecap="butt"/>`);

  (m.wlabels||[]).forEach(([t,a,off,dy],i)=>o+=`<path id="w-${i}" d="${smooth(LL(a))}" fill="none"/><text class="m-wlbl" dy="${dy===undefined?-5:dy}"><textPath href="#w-${i}" startOffset="${off}%">${t}</textPath></text>`);
  if(m.big&&m.big.label){const [t,lo,la]=m.big.label,[x,y]=P(lo,la);o+=`<text class="m-wlbl" x="${x}" y="${y}" text-anchor="middle" style="font-size:17px;letter-spacing:4px">${t}</text>`}
  return _lay[k]=o;
}
function viewCityMap(){

  const zoom=`<div class="zoomctl"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="reset" aria-label="Reset view" style="font-size:16px">⌂</button></div>`;

  if(route){
    const tday=DAYS.find(d=>d.city==="amsterdam"&&dayNum(d)===f);
    if(tday&&!tday.items.some(x=>x.pt)) return top+chips+tripPanel(tday);

  const compass='<svg class="compass" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="#6B4F2C" stroke-width="1.5"/><circle cx="32" cy="32" r="24" fill="none" stroke="#6B4F2C" stroke-width=".8"/><polygon points="32,3 36,28 61,32 36,36 32,61 28,36 3,32 28,28" fill="#8A6A3A" stroke="#4A3520" stroke-width=".8"/><polygon points="32,3 36,28 28,28" fill="#A8432F" stroke="#4A3520" stroke-width=".8"/></svg>';
  return `<div class="strip"><button class="chip" data-back="1">Back to route map</button>${Object.keys(CITY).map(k=>`<button class="chip" aria-pressed="${state.city===k}" data-city="${k}">${CITY[k].name}</button>`).join("")}</div>
   ${chips}<div class="citywrap paper">${compass}<div class="mtitle"><b>${CM.name}</b><i>${CM.sub||"Anno 2026, north is up"}</i></div>${svg}<div class="zoomctl"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="reset" aria-label="Reset view" style="font-size:16px">⌂</button></div>${sheet}</div>${legend}
   <div class="note small">Hand-drawn sketch. Dot positions are approximate, so tap Open in Maps for the exact spot. Drag to pan, pinch or use + and − to zoom. ${CM.off}</div>`;
}
/* pan and zoom */
const ptrs=new Map(); let drag=null;
function applyVb(){const s=$("#citymap");if(s){const v=state.vb;s.setAttribute("viewBox",`${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}`)}}
function zoomAt(cx,cy,k){
  const s=$("#citymap");if(!s)return;const r=s.getBoundingClientRect(),v=state.vb;
  const fx=(cx-r.left)/r.width, fy=(cy-r.top)/r.height;
  const px=v.x+fx*v.w, py=v.y+fy*v.h;
  const w=Math.min(CM.maxW||800,Math.max(150,v.w*k)), h=w*1.25;
  v.x=px-fx*w; v.y=py-fy*h; v.w=w; v.h=h; applyVb();
}
document.addEventListener("pointerdown",e=>{
  const s=e.target.closest("#citymap"); if(!s) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{s.setPointerCapture(e.pointerId)}catch(err){}
  const dot=e.target.closest("[data-dot]");
  if(ptrs.size===1) drag={moved:false,dot:dot?dot.dataset.dot:null,sx:e.clientX,sy:e.clientY};
  else if(drag){drag.moved=true;const [a,b]=[...ptrs.values()];drag.pd=Math.hypot(a.x-b.x,a.y-b.y)}
});
document.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!drag) return;
  const old=ptrs.get(e.pointerId), s=$("#citymap"); if(!s) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6) drag.moved=true;
    if(drag.moved){const r=s.getBoundingClientRect(),v=state.vb;v.x-=(e.clientX-old.x)*v.w/r.width;v.y-=(e.clientY-old.y)*v.h/r.height;applyVb()}
  } else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()], nd=Math.hypot(a.x-b.x,a.y-b.y);
    if(drag.pd&&nd>0) zoomAt((a.x+b.x)/2,(a.y+b.y)/2,drag.pd/nd);
    drag.pd=nd;
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  const wasOne=ptrs.size===1; ptrs.delete(e.pointerId);
  if(wasOne&&drag&&!drag.moved&&drag.dot&&e.type==="pointerup"){state.sel=drag.dot;drag=null;render();return}
  if(ptrs.size===0) drag=null;
}
document.addEventListener("pointerup",endPtr);
document.addEventListener("pointercancel",endPtr);
document.addEventListener("wheel",e=>{if(e.target.closest&&e.target.closest("#citymap")){e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?1.12:.89)}},{passive:false});

/* ---------- EVENTS ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("summary")) return;
  const t=e.target.closest("[data-tab],[data-day],[data-city],[data-filter],[data-lcity],[data-lcat],[data-fact],[data-vote],[data-open],[data-back],[data-zoom],[data-dayf],[data-desel],[data-dmap],[data-area],[data-nudgex],#copyVotes");
  if(!t) return;
  const d=t.dataset;
  if(d.nudgex!==undefined){store.set("installHide",true);render();return}
  if(d.tab){e.preventDefault();state.tab=d.tab;window.scrollTo(0,0)}
  else if(d.area){state.area=state.area===d.area?null:d.area}
  else if(d.dmap){state.tab="map";state.city="amsterdam";state.mapOpen=true;state.dayF=+d.dmap;state.vb=null;state.sel=null;window.scrollTo(0,0)}
  else if(d.day!==undefined){state.dayIdx=+d.day}
  else if(d.vote){const v=store.get("votes",{});v[d.vote]=d.val;store.set("votes",v)}
  else if(d.open!==undefined){state.dayIdx=+d.open;state.tab="today";window.scrollTo(0,0)}
  else if(d.back){state.mapOpen=false;state.sel=null}
  else if(d.zoom){const s=$("#citymap");if(s){const r=s.getBoundingClientRect();if(d.zoom==="reset"){state.vb=null;state.sel=null}else{zoomAt(r.left+r.width/2,r.top+r.height/2,d.zoom==="in"?.7:1.4);return}}}
  else if(d.dayf){state.dayF=d.dayf==="all"?"all":+d.dayf;state.sel=null;if(state.city==="amsterdam")state.vb=null}
  else if(d.desel!==undefined){state.sel=null}
  else if(d.city){state.city=d.city;state.filter="all";state.sel=null;state.mapOpen=!!MAPS[d.city];state.vb=null;state.dayF="all"}
  else if(d.filter){state.filter=d.filter}
  else if(d.lcity){state.learnCity=d.lcity;state.openFact=null}
  else if(d.lcat){state.learnCat=d.lcat}
  else if(d.fact){state.openFact=state.openFact===d.fact?null:d.fact}
  else if(t.id==="copyVotes"){
    const v=store.get("votes",{});
    const txt="My picks:\n"+Object.keys(VOTES).map(id=>`${VOTES[id].label}: ${v[id]||"no pick yet"}`).join("\n");
    try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>toast("Could not copy"))}catch(err){toast("Could not copy")}
    return;
  }
  render();
});
document.addEventListener("change",e=>{
  const c=e.target.closest("[data-check]"); if(!c) return;
  const done=store.get("checks",{}); done[c.dataset.check]=c.checked; store.set("checks",done);
  c.closest(".check").classList.toggle("done",c.checked);
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".sk-area")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".mdot")){e.preventDefault();state.sel=e.target.dataset.dot;render();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".pin")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
render();
/* When the app is reopened from the home screen (or the date rolls over), re-check the date */
function refreshDay(){
  const nt=todayIso(); if(nt===T) return;
  T=nt; inTrip=T>=trip0&&T<=tripN;
  if(inTrip){const i=DAYS.findIndex(d=>d.date===T); if(i>=0){state.dayIdx=i; state.city=DAYS[i].city; state.learnCity=state.city;}}
  render();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshDay()});
window.addEventListener("pageshow",refreshDay);
window.addEventListener("focus",refreshDay);
setInterval(refreshDay,60000);
</script>
